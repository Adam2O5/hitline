name = "hitline-game"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "hitline"
database_id = "25cbb318-d17f-44c8-8701-34c82054ce03"
migrations_dir = "migrations"

[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

[triggers]
crons = ["0 3 * * *"]
